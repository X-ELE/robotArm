services:
  ros2_dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: robot_arm_ros2:humble
    container_name: robot_arm_ros2_container
    network_mode: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ..:/root/robot_ws:rw
      - /dev:/dev
    stdin_open: true
    tty: true
    working_dir: /root/robot_ws
    command: bash
